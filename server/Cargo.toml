[package]
name = "commander-server"
version = "0.3.2"
edition = "2024"
publish = false

[lib]
name = "commander"
path = "src/lib.rs"

[[bin]]
name = "commander-server"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"

[profile.release]
strip = true
